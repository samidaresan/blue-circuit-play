name: Publish BLUE CIRCUIT to Pages

# Publishing is an explicit browser action; a push alone never deploys this game.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Restore verified game files and set the public WSS URL
        env:
          PUBLIC_WEBSOCKET_URL: ${{ vars.PUBLIC_WEBSOCKET_URL }}
        run: python tools/restore_pages.py --source publish/web --output build/pages_site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages_site
      - id: deployment
        uses: actions/deploy-pages@v4
